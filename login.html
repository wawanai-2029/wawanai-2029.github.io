<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - WN</title>
<link rel="stylesheet" href="style.css">
<style>
.form-box{max-width:400px;margin:auto;background:white;padding:20px;border-radius:10px;margin-top:60px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
input{width:100%;padding:10px;margin-top:10px;border-radius:5px;border:1px solid #ccc;}
button{width:100%;padding:10px;margin-top:20px;background:#3554F0;color:white;border:none;border-radius:5px;}
</style>
</head>
<body>

<header>🔑 Login Untuk Masuk</header>

<div class="form-box">
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Masuk</button>
    <p style="margin-top:15px">Belum punya akun? <a href="register.html">Daftar</a></p>
</div>

<script>
function login(){
    let users = JSON.parse(localStorage.getItem("users") || "{}");
    let u = user.value.trim();
    let p = pass.value.trim();

    if(users[u] && users[u]==p){
        localStorage.setItem("loggedUser",u);
        window.location="index.html";
    }else{
        alert("Username atau password salah!");
    }
}
</script>

</body>
</html>
